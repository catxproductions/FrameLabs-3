name: Windows Desktop Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "CMakeLists.txt"
      - "native/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "native/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build FrameLabs 3 for Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compile native application
        run: cmake --build build --config Release --parallel

      - name: Run structural regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build/bin/FrameLabs3.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameLabs3-Windows-x64
          path: build/bin/FrameLabs3.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest Windows release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.${{ github.run_number }}
          name: FrameLabs 3 v0.4.${{ github.run_number }}
          target_commitish: main
          files: build/bin/FrameLabs3.exe
          generate_release_notes: true
          make_latest: true

      - name: Publish manually tagged Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/FrameLabs3.exe
          generate_release_notes: true
