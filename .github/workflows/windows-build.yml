name: Windows Desktop Build

on:
  push:
    branches:
      - feat/ui-foundation
      - main
    paths:
      - "CMakeLists.txt"
      - "native/**"
      - "scripts/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "native/**"
      - "scripts/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build FrameLabs 3 for Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compile native application
        run: cmake --build build --config Release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build/bin/FrameLabs3.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FrameLabs3-Windows-x64
          path: build/bin/FrameLabs3.exe
          if-no-files-found: error
          retention-days: 14
